name: LodServer
prefix: LodServer
version: '0.2.0'
main: cc.taixue.lod.server.LodServer
api-version: '1.21.4'
softdepend: [Multiverse-Core, LuckPerms, ViaVersion, FastAsyncWorldEdit, WorldEdit]
description: Permission-aware server LOD cache for Voxy and Distant Horizons
commands:
  lods:
    aliases: [lod]
    description: Manage shared LOD cache, worlds, and prewarming
    permission: distant_horizons.admin
permissions:
  archlod.use:
    default: true
    description: Receive distant terrain, additionally requiring world access
  distant_horizons.admin:
    default: op
  archlod.upload:
    default: false
    description: Offer local cache when uploads are enabled and world access is granted
