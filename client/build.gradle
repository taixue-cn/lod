plugins { id 'fabric-loom' }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11'
    implementation project(':core')
    include project(':core')
    if (System.getenv('ARCH_LOD_TEST_MODS')) {
        modRuntimeOnly fileTree(dir: System.getenv('ARCH_LOD_TEST_MODS'),include:['*.jar'])
        runtimeOnly fileTree(dir: System.getenv('ARCH_LOD_TEST_MODS') + '/nested',include:['*.jar'])
    }
}
sourceSets {
    fixture {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        taixue_lod { sourceSet sourceSets.main }
        if (System.getenv('ARCH_LOD_NATIVE_TEST')) archlod_client_fixture { sourceSet sourceSets.fixture }
    }
    runs {
        client {
            runDir System.getenv('ARCH_LOD_RUN_DIR') ?: 'run'
            vmArgs '-Xmx1536m'
            if (System.getenv('ARCH_LOD_NATIVE_TEST')) {
                source sourceSets.fixture
                vmArg '-Darchlod.fixture.report=' + System.getenv('ARCH_LOD_NATIVE_REPORT')
                vmArg '-Darchlod.fixture.mode=' + System.getenv('ARCH_LOD_NATIVE_TEST')
                if(System.getenv('ARCH_LOD_NATIVE_TEST') == 'dh') vmArg '-Dmixin.env.remapRefMap=false'
                programArgs '--username','LODNative','--quickPlayMultiplayer',System.getenv('ARCH_LOD_NATIVE_SERVER'),'--width','640','--height','480'
            }
        }
    }
}
base { archivesName = 'taixue-lod-client' }

jar {
    from(rootProject.file('LICENSE'))
    from(rootProject.file('third-party/LSS-LICENSE')) { into 'META-INF/third-party' }
    from(rootProject.file('third-party/LSS-PROVENANCE.txt')) { into 'META-INF/third-party' }
}
tasks.register('fixtureJar',Jar) {
    dependsOn fixtureClasses
    archiveClassifier = 'fixture-dev'
    from sourceSets.fixture.output
}
tasks.register('remapFixtureJar',net.fabricmc.loom.task.RemapJarTask) {
    dependsOn fixtureJar
    inputFile = tasks.fixtureJar.archiveFile
    archiveClassifier = 'fixture'
    addNestedDependencies = false
}
