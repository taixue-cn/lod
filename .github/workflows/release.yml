name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build Paper server and Minecraft 1.21.11 client
        run: ./gradlew --no-daemon checkKotlinFormat :core:test :server:test :server:shadowJar :client:remapJar
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test and build Paper 26.3 server
        working-directory: server-26.3
        run: ./gradlew --no-daemon build
      - name: Test and build Minecraft 26.3 client
        working-directory: client-26.3
        run: ./gradlew --no-daemon build
      - name: Prepare release files
        shell: bash
        run: |
          mkdir release
          cp server/build/libs/LodServer-0.2.0.jar release/LodServer-0.2.0.jar
          cp server-26.3/build/libs/LodServer-0.2.0+mc26.3.jar release/LodServer-0.2.0+mc26.3.jar
          cp client/build/libs/LodClient-0.2.0.jar release/LodClient-0.2.0+mc1.21.11.jar
          cp client-26.3/build/libs/LodClient-0.2.0+mc26.3.jar release/LodClient-0.2.0+mc26.3.jar
          cp README.txt LICENSE release/
          cp -r third-party release/
          cd release
          sha256sum *.jar > SHA256SUMS
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
        shell: bash
        run: |
          tag="build-${BUILD}-${COMMIT:0:7}"
          gh release create "$tag" release/*.jar release/SHA256SUMS release/README.txt release/LICENSE \
            --target "$COMMIT" --title "LOD build ${BUILD}" --generate-notes --latest
