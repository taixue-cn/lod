plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
group = 'cc.taixue.lod'
version = '0.2.0+mc26.3'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Version-specific names and native section layout stay isolated from 1.21.11.
def portSources = tasks.register('portSources') {
    inputs.dir('../core/src/main/java'); inputs.dir('../client/src/main/java')
    outputs.dir(layout.buildDirectory.dir('generated/sources/port'))
    doLast {
        def replacements = [
            'NATIVE_COUNT_SHORTS = 1;': 'NATIVE_COUNT_SHORTS = 2;',
            'ClientCommandManager.*': 'ClientCommands.*',
            'p.displayClientMessage(Component.literal(s),false)': 'p.sendSystemMessage(Component.literal(s))',
            'PayloadTypeRegistry.playC2S()': 'PayloadTypeRegistry.serverboundPlay()',
            'PayloadTypeRegistry.playS2C()': 'PayloadTypeRegistry.clientboundPlay()',
            'chunkPosition().x': 'chunkPosition().x()',
            'chunkPosition().z': 'chunkPosition().z()',
            'state.getValues().entrySet()': 'state.getValues().toList()',
            'entry.getKey()': 'entry.property()',
            'entry.getValue()': 'entry.value()'
        ]
        def used = [] as Set
        def output = layout.buildDirectory.dir('generated/sources/port').get().asFile
        delete output
        ['../core/src/main/java', '../client/src/main/java'].each { source ->
            fileTree(source).matching { include '**/*.java' }.each { input ->
                def text = input.getText('UTF-8')
                replacements.each { before, after ->
                    // Only VoxyCacheReader changed its property iterator in 26.3.
                    if (before.startsWith('entry.') && input.name != 'VoxyCacheReader.java') return
                    if (text.contains(before)) { used.add(before); text = text.replace(before, after) }
                }
                def target = new File(output, file(source).toPath().relativize(input.toPath()).toString())
                target.parentFile.mkdirs()
                target.setText(text, 'UTF-8')
            }
        }
        assert used == replacements.keySet() : 'Shared sources changed; review the 26.3 port replacements'
    }
}
sourceSets.main.java.srcDirs = [layout.buildDirectory.dir('generated/sources/port')]
sourceSets.main.resources.srcDirs = ['../client/src/main/resources']
tasks.compileJava.dependsOn portSources
tasks.processResources {
    inputs.property('clientDisplayName', 'LODClient')
    filesMatching('fabric.mod.json') {
        filter { line -> line.replace('"0.2.0"', '"0.2.0+mc26.3"').replace('"1.21.11"', '"26.3"').replace('>=0.18.4', '>=0.20.1').replace('>=21', '>=25').replace('Taixue LOD Bridge', 'LODClient') }
    }
}
base { archivesName = 'lodclient' }
jar {
    from('../LICENSE')
    from(['../third-party/LSS-LICENSE', '../third-party/LSS-PROVENANCE.txt']) { into 'META-INF/third-party' }
}
sourceSets {
    fixture {
        java.srcDir '../client/src/fixture/java'
        resources.srcDir '../client/src/fixture/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
tasks.register('fixtureJar', Jar) {
    dependsOn fixtureClasses
    archiveClassifier = 'fixture'
    from sourceSets.fixture.output
}

loom { mods { taixue_lod { sourceSet sourceSets.main } } }

sourceSets.test.java.srcDir '../core/src/test/java'
test { useJUnitPlatform() }
